# Traefik on Kubernetes (Phase 10): the public entrypoint, and the router for every sandbox preview.
#
# This replaces the Docker setup. There the Docker provider watched the Docker socket and read
# `traefik.*` labels off containers. Here Traefik's Kubernetes CRD provider watches IngressRoute
# objects through the Kubernetes API, and the orchestrator creates one per sandbox (see
# packages/orchestrator/src/containers/k8sManager.ts). No Docker socket is mounted, and no
# pod carries a Docker-style label.
#
# Install the Traefik CRDs first. They are Traefik's own definitions, about 3,000 lines, so they
# are installed from the official release rather than copied here. Use server-side apply: the
# file is too large for the annotation that client-side apply adds.
#
#   kubectl apply --server-side -f \
#     https://raw.githubusercontent.com/traefik/traefik/v3.1/docs/content/reference/dynamic-configuration/kubernetes-crd-definition-v1.yml
#
# Keep the CRD version and the image tag below on the same Traefik release (v3.1).
#
# Certificates. The sandbox IngressRoutes ask the "letsencrypt" resolver for one wildcard
# certificate when SESSION_HOST_SUFFIX is a real domain. Wildcards need DNS-01 validation, so:
#   - edit ACME_EMAIL, ACME_CA_SERVER and ACME_DNS_PROVIDER in the ConfigMap below, and
#   - create Secret live-proxy-dns in namespace live-system holding your DNS provider's
#     credential variables (for Cloudflare: CF_DNS_API_TOKEN). It is optional: without it the
#     proxy still runs, and plain-HTTP routes (SESSION_HOST_SUFFIX=.localhost) work.
# The defaults use Let's Encrypt's STAGING server, so a mistake cannot hit production rate limits.
# Switch ACME_CA_SERVER to https://acme-v02.api.letsencrypt.org/directory when staging works.
#
# One replica, on purpose. Traefik's ACME store is a single file that cannot be shared by several
# replicas: two replicas would each request certificates and quickly exhaust Let's Encrypt's rate
# limits. The cost is that the proxy restarts, with a short outage, when its node fails or it is
# upgraded. To run several replicas, move certificate issuance to cert-manager instead.
apiVersion: v1
kind: Namespace
metadata:
  name: live-system
  labels:
    app.kubernetes.io/part-of: live
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: live-proxy
  namespace: live-system
  labels:
    app.kubernetes.io/name: live-proxy
    app.kubernetes.io/part-of: live
---
# Traefik's published permissions for the Kubernetes CRD provider (v3.1): read services, endpoint
# slices, secrets and its own CRDs. Reading secrets cluster-wide is how Traefik loads TLS
# certificates; the --providers.kubernetescrd.namespaces flag below limits what it actually uses.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: live-proxy
  labels:
    app.kubernetes.io/part-of: live
rules:
  - apiGroups: [""]
    resources: ["services", "secrets", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update"]
  - apiGroups: ["traefik.io"]
    resources:
      - middlewares
      - middlewaretcps
      - ingressroutes
      - traefikservices
      - ingressroutetcps
      - ingressrouteudps
      - tlsoptions
      - tlsstores
      - serverstransports
      - serverstransporttcps
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: live-proxy
  labels:
    app.kubernetes.io/part-of: live
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: live-proxy
subjects:
  - kind: ServiceAccount
    name: live-proxy
    namespace: live-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: live-proxy-config
  namespace: live-system
  labels:
    app.kubernetes.io/name: live-proxy
    app.kubernetes.io/part-of: live
data:
  ACME_EMAIL: "dev@example.invalid"
  ACME_CA_SERVER: "https://acme-staging-v02.api.letsencrypt.org/directory"
  ACME_DNS_PROVIDER: "cloudflare"
---
# Holds acme.json, so the issued wildcard certificate survives restarts (Let's Encrypt rate-limits
# duplicate issuance).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: live-proxy-acme
  namespace: live-system
  labels:
    app.kubernetes.io/name: live-proxy
    app.kubernetes.io/part-of: live
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-proxy
  namespace: live-system
  labels:
    app.kubernetes.io/name: live-proxy
    app.kubernetes.io/part-of: live
spec:
  replicas: 1
  revisionHistoryLimit: 5
  # The certificate volume is ReadWriteOnce, so the old pod must stop before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: live-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: live-proxy
        app.kubernetes.io/part-of: live
    spec:
      serviceAccountName: live-proxy
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traefik
          image: traefik:v3.1
          imagePullPolicy: IfNotPresent
          args:
            # Unprivileged ports inside the pod; the Service maps 80 and 443 onto them.
            - --entrypoints.web.address=:8000
            - --entrypoints.websecure.address=:8443
            # Health check and metrics only. Deliberately not 8080, which is the sandbox preview port,
            # and the dashboard/API are off.
            - --entrypoints.traefik.address=:9000
            - --ping=true
            - --metrics.prometheus=true
            - --metrics.prometheus.entrypoint=traefik
            # Routes come from IngressRoute objects in these two namespaces, and nowhere else.
            - --providers.kubernetescrd=true
            - --providers.kubernetescrd.namespaces=live-system,live-sandboxes
            - --providers.kubernetescrd.allowCrossNamespace=false
            - --providers.kubernetescrd.allowExternalNameServices=false
            # Same resolver name as proxyLabels.ts and k8sManager.ts (K8S_CERT_RESOLVER).
            - --certificatesresolvers.letsencrypt.acme.email=$(ACME_EMAIL)
            - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
            - --certificatesresolvers.letsencrypt.acme.caserver=$(ACME_CA_SERVER)
            - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
            - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=$(ACME_DNS_PROVIDER)
            - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
            - --global.checknewversion=false
            - --global.sendanonymoususage=false
            - --log.level=INFO
          env:
            - name: ACME_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: live-proxy-config
                  key: ACME_EMAIL
            - name: ACME_CA_SERVER
              valueFrom:
                configMapKeyRef:
                  name: live-proxy-config
                  key: ACME_CA_SERVER
            - name: ACME_DNS_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: live-proxy-config
                  key: ACME_DNS_PROVIDER
          # DNS provider credentials (for example CF_DNS_API_TOKEN), if the secret exists.
          envFrom:
            - secretRef:
                name: live-proxy-dns
                optional: true
          ports:
            - name: web
              containerPort: 8000
              protocol: TCP
            - name: websecure
              containerPort: 8443
              protocol: TCP
            - name: traefik
              containerPort: 9000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ping
              port: traefik
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /ping
              port: traefik
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: acme
              mountPath: /letsencrypt
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: acme
          persistentVolumeClaim:
            claimName: live-proxy-acme
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
# The public entrypoint. LoadBalancer gets an external address from your cloud; on a cluster
# without one the address stays pending and you reach the proxy through a NodePort or a
# port-forward. `Local` keeps the visitor's real IP address.
apiVersion: v1
kind: Service
metadata:
  name: live-proxy
  namespace: live-system
  labels:
    app.kubernetes.io/name: live-proxy
    app.kubernetes.io/part-of: live
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: live-proxy
  ports:
    - name: web
      port: 80
      targetPort: web
      protocol: TCP
    - name: websecure
      port: 443
      targetPort: websecure
      protocol: TCP
---
# Prometheus scrapes Traefik here. Cluster-internal only.
apiVersion: v1
kind: Service
metadata:
  name: live-proxy-metrics
  namespace: live-system
  labels:
    app.kubernetes.io/name: live-proxy
    app.kubernetes.io/part-of: live
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: live-proxy
  ports:
    - name: metrics
      port: 9000
      targetPort: traefik
      protocol: TCP