# Redis on Kubernetes (Phase 10): shared session state for the orchestrator replicas.
#
# A StatefulSet rather than a Deployment: Redis owns data, so it gets its own persistent volume
# and a stable identity, and a restart never mounts the volume twice. One replica, with
# append-only persistence (fsync every second, as in docker-compose.prod.yml), so a restart
# loses at most about a second of writes. This is a single instance, not a cluster: it is the
# one stateful dependency of the control plane.
#
# Create the password first, in namespace live-system (URL-safe characters only, because the
# orchestrator puts it into REDIS_URL):
#   Secret live-redis, key: password
#
# Only the orchestrator and streaming pods may connect (NetworkPolicy below; it needs a CNI that
# enforces NetworkPolicy, as infra/k8s/network-policy.yaml explains).
apiVersion: v1
kind: Namespace
metadata:
  name: live-system
  labels:
    app.kubernetes.io/part-of: live
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Service
metadata:
  name: live-redis
  namespace: live-system
  labels:
    app.kubernetes.io/name: live-redis
    app.kubernetes.io/part-of: live
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: live-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: live-redis
  namespace: live-system
  labels:
    app.kubernetes.io/name: live-redis
    app.kubernetes.io/part-of: live
spec:
  serviceName: live-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: live-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: live-redis
        app.kubernetes.io/part-of: live
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      # redis:7-alpine runs as uid 999 (user "redis"); fsGroup makes the volume writable for it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - exec redis-server --dir /data --appendonly yes --appendfsync everysec --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: live-redis
                  key: password
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: live-redis
          app.kubernetes.io/part-of: live
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# Only the control plane may reach Redis. Sandboxes live in another namespace and are already
# locked down, but this keeps every other pod in live-system out too.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: live-redis-allow-control-plane
  namespace: live-system
  labels:
    app.kubernetes.io/part-of: live
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: live-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: live-orchestrator
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: live-streaming
      ports:
        - protocol: TCP
          port: 6379